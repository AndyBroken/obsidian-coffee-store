<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All Coffee — Obsidian Coffee Roasters</title>
<meta name="description" content="Shop single origins, blends, decaf and reserve lots. Filter by roast, origin and price.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230e0d0c'/><path d='M12 3l7 9-7 9-7-9z' fill='%23c9a86a'/></svg>">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="shop">
<div id="header"></div>

<main class="container">
  <div class="page-hero">
    <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
    <span class="eyebrow">The Collection</span>
    <h1>Shop all coffee</h1>
    <p>Every coffee is roasted to order on the day it ships. Choose whole bean or let us grind it for your brewer.</p>
  </div>

  <div class="shop">
    <aside class="sidebar" id="sidebar">
      <div class="filter-toggle sidebar-head"><h3 style="font-size:1.8rem">Filters</h3><button class="icon-btn" onclick="closeCart()" aria-label="Close filters"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="search"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search coffee or notes…" aria-label="Search"></div>
      <div class="fgroup"><h4>Category</h4><div id="fCat"></div></div>
      <div class="fgroup"><h4>Roast</h4><div id="fRoast"></div></div>
      <div class="fgroup"><h4>Origin</h4><div id="fRegion"></div></div>
      <div class="fgroup"><h4>Max Price</h4><input type="range" id="price" min="18" max="70" value="70" step="1" aria-label="Maximum price"><div class="range-row"><span>$18</span><span id="priceVal">$70</span></div></div>
      <button class="btn btn-line" id="reset">Reset filters</button>
    </aside>

    <div>
      <div class="toolbar">
        <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
          <button class="btn btn-line filter-toggle" id="openFilters" style="height:44px">Filters</button>
          <span class="muted" id="count"></span>
          <div class="active-filters" id="active"></div>
        </div>
        <select id="sort" aria-label="Sort products">
          <option value="feat">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option><option value="name">Name A–Z</option>
        </select>
      </div>
      <div class="products" id="grid"></div>
    </div>
  </div>
</main>

<div id="footer"></div>
<script src="assets/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const state = { cat: new Set(params.get('cat') ? [params.get('cat')] : []), roast: new Set(), region: new Set(), q: '', max: 70, sort: 'feat' };
const groups = { cat: 'fCat', roast: 'fRoast', region: 'fRegion' };
const valuesOf = k => [...new Set(PRODUCTS.map(p => p[k]))];
for (const [k, el] of Object.entries(groups)) {
  document.getElementById(el).innerHTML = valuesOf(k).map(v => `<label class="check"><input type="checkbox" data-k="${k}" value="${v}" ${state[k].has(v) ? 'checked' : ''}>${v}<span class="n">${PRODUCTS.filter(p => p[k] === v).length}</span></label>`).join('');
}
document.querySelectorAll('.check input').forEach(c => c.onchange = () => { c.checked ? state[c.dataset.k].add(c.value) : state[c.dataset.k].delete(c.value); render(); });
const q = document.getElementById('q'), price = document.getElementById('price');
q.oninput = () => { state.q = q.value.trim().toLowerCase(); render(); };
price.oninput = () => { state.max = +price.value; document.getElementById('priceVal').textContent = '$' + price.value; render(); };
document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };
document.getElementById('reset').onclick = () => { ['cat', 'roast', 'region'].forEach(k => state[k].clear()); state.q = ''; state.max = 70; q.value = ''; price.value = 70; document.getElementById('priceVal').textContent = '$70'; document.querySelectorAll('.check input').forEach(c => c.checked = false); render(); };
document.getElementById('openFilters').onclick = () => { document.getElementById('sidebar').classList.add('open'); overlay.classList.add('open'); };

function render() {
  let list = PRODUCTS.filter(p =>
    (!state.cat.size || state.cat.has(p.cat)) && (!state.roast.size || state.roast.has(p.roast)) && (!state.region.size || state.region.has(p.region)) &&
    p.price <= state.max && (!state.q || [p.name, p.type, p.origin, ...p.notes].join(' ').toLowerCase().includes(state.q)));
  const s = { low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price, rating: (a, b) => b.rating - a.rating, name: (a, b) => a.name.localeCompare(b.name) }[state.sort];
  if (s) list = [...list].sort(s);
  document.getElementById('grid').innerHTML = list.length ? list.map(productCard).join('') : `<div class="no-results"><h3 style="font-size:2rem;margin-bottom:.5rem">No coffees match</h3><p>Try removing a filter or searching for a tasting note like “chocolate”.</p></div>`;
  document.getElementById('count').textContent = `${list.length} of ${PRODUCTS.length} coffees`;
  const chips = [...['cat', 'roast', 'region'].flatMap(k => [...state[k]].map(v => [k, v])), ...(state.max < 70 ? [['max', `Under $${state.max}`]] : []), ...(state.q ? [['q', `“${state.q}”`]] : [])];
  document.getElementById('active').innerHTML = chips.map(([k, v]) => `<button data-k="${k}" data-v="${v}">${v} ✕</button>`).join('');
  document.querySelectorAll('#active button').forEach(b => b.onclick = () => {
    const { k, v } = b.dataset;
    if (k === 'max') { state.max = 70; price.value = 70; document.getElementById('priceVal').textContent = '$70'; }
    else if (k === 'q') { state.q = ''; q.value = ''; }
    else { state[k].delete(v); document.querySelector(`.check input[data-k="${k}"][value="${v}"]`).checked = false; }
    render();
  });
  observeReveals();
}
render();
</script>
</body>
</html>
